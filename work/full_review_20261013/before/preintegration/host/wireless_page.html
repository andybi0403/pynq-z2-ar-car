<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小车无线控制台</title><style>
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#f2f4f7;color:#152437;max-width:1120px;margin:24px auto;padding:0 16px}
section{background:white;border-radius:12px;padding:18px;margin:16px 0}button{padding:10px 16px;margin:4px;border:0;border-radius:7px;background:#2458a6;color:white}button.stop{background:#b82d35}img{max-width:100%;background:#172332}.pair{display:flex;gap:10px}.pair img{width:49%}pre{white-space:pre-wrap}#keys{font-size:14px}a{color:#2458a6}
[hidden]{display:none!important}canvas{max-width:100%;background:#172332}select{padding:8px;margin:5px}
</style><h1>小车无线控制台</h1><p id="connection">正在连接…</p>
<section><button id="raw">原图</button><button id="processed">PL处理图</button><button id="freeze">同帧冻结对比</button><p id="videoStatus">等待视频</p><p id="rates">接收 / 实际绘制帧率等待统计</p><canvas id="video" width="1280" height="720" aria-label="小车实时画面"></canvas><div class="pair" id="pair" hidden><img id="rawFrozen" alt="冻结原图"><img id="processedFrozen" alt="同帧PL画面"></div>
<p><label>输出模式 <select id="mode"><option value="auto">自动调节</option><option value="manual">手动画质与帧率</option><option value="fixed">固定验收 30fps / Q75</option></select></label><label>帧率上限 <select id="fps"></select></label><label>JPEG画质上限 <select id="quality"></select></label><button id="apply">应用</button></p><p id="policyStatus"></p><p>始终保持1280×720。质量数字是编码参数，作用于PL处理图；原图保持摄像头原生JPEG。绘制帧率按实际canvas绘制统计，屏幕延迟仍需实测。</p></section>
<section><button id="claim">接管控制</button><button class="stop" id="stop">停车 · 空格</button><p id="keys">WASD驾驶；当前LAB_ONLY仅接受零意图，未开放电机运动。</p><p id="controlStatus">未接管</p><pre id="status"></pre></section>
<section><h2>运动显示</h2><p id="motionNumbers" style="font-size:24px;font-weight:600">等待显示数据</p><p id="motionMode">显示状态 · 原始测量与控制状态独立保留</p></section>
<section><a id="log" href="/api/log/joint.jsonl">下载运行记录</a> · <a href="/api/log/joint_summary.json">下载验收摘要</a></section>
<script src="/assets/wireless_player.js"></script><script>
const el=id=>document.getElementById(id);let socket,claimed=false,synced=false,seq=0,view='processed',keys=new Set(),frozen=false,pending=new Map();
const displayModes={smoothed:'平滑显示',hold:'短时保持',stationary_assumption:'静止展示',locked_zero_estimate:'锁车零速',measured_model_estimate:'模型显示',unavailable:'显示不可用',telemetry_expired:'更新中断'};
function renderMotion(a,fresh){const d=a.motion_display;const available=fresh&&d?.available;const n=v=>Number.isFinite(v)?v.toFixed(2):'—';el('motionNumbers').textContent=available?`轮速 ${n(d.speed_mm_s)} mm/s · 路程 ${n(d.travelled_mm)} mm · 位移 ${n(d.displacement_mm)} mm`:'显示暂不可用';el('motionMode').textContent=(displayModes[d?.mode]||'显示不可用')+' · 原始测量与控制状态独立保留';}
const player=new CarVideo.WirelessPlayer(el('video'),message=>{if(!frozen)el('videoStatus').textContent=message;});
for(const fps of [30,25,24,20,15,10,5])el('fps').add(new Option(fps+' fps',fps));
for(const q of [95,85,75,65,55,45,35])el('quality').add(new Option('Q'+q,q));el('quality').value='75';
el('apply').onclick=async()=>{try{await api('/api/video/settings',{mode:el('mode').value,fps:Number(el('fps').value),quality:Number(el('quality').value)});}catch(e){el('policyStatus').textContent=e.message;}};
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r;}
function send(body){if(socket?.readyState===1)socket.send(JSON.stringify(body));}
function stop(){keys.clear();claimed=false;send({type:'stop'});el('controlStatus').textContent='已撤销驾驶意图，等待实际反馈';}
function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/control`);socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='sync'){const t=performance.now();send({type:'sync',nonce:m.nonce,received_ms:t,sent_ms:performance.now()});}if(m.type==='synced')synced=true;if(m.type==='ack'&&pending.has(m.seq)){send({type:'ack_timing',rtt_ms:performance.now()-pending.get(m.seq)});pending.delete(m.seq);}if(m.type==='claimed'){claimed=true;el('controlStatus').textContent=m.motion_allowed?'已接管':'已接管台架会话 · 零输出';}if(m.type==='error'){claimed=false;keys.clear();el('controlStatus').textContent=m.error;}};socket.onclose=()=>{claimed=false;synced=false;keys.clear();pending.clear();el('controlStatus').textContent='控制连接断开；重连后需重新接管';setTimeout(connect,1000);};}
el('claim').onclick=()=>{if(synced)send({type:'claim',client_ms:performance.now()});};el('stop').onclick=stop;
setInterval(()=>{if(claimed){const now=performance.now();pending.set(++seq,now);if(pending.size>30)pending.delete(pending.keys().next().value);send({type:'intent',seq,client_ms:now,left:0,right:0});}},50);
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();stop();}if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code)){e.preventDefault();keys.add(e.code);}});
window.addEventListener('keyup',e=>{if(keys.delete(e.code))stop();});window.addEventListener('blur',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});window.addEventListener('pagehide',stop);
function live(next){view=next;frozen=false;el('pair').hidden=true;el('video').hidden=false;player.start(view);el('videoStatus').textContent=next==='raw'?'原图实时画面':'真实PL处理画面';}
el('raw').onclick=()=>live('raw');el('processed').onclick=()=>live('processed');
el('freeze').onclick=async()=>{try{const f=await(await api('/api/snapshot',{})).json();frozen=true;player.stop();el('video').hidden=true;el('pair').hidden=false;el('rawFrozen').src='data:image/jpeg;base64,'+f.raw_jpeg_base64;el('processedFrozen').src='data:image/jpeg;base64,'+f.processed_jpeg_base64;el('videoStatus').textContent=`同一采集帧 #${f.frame_id} · 历史画面不参与当前控制`;}catch(e){el('videoStatus').textContent=e.message;}};
async function poll(){try{const s=await(await api('/api/status')).json(),a=s.latest?.status||{},r=player.rates(),p=s.video?.output_policy;el('connection').textContent=s.running?(s.control_available===false?'视频测试运行中 · 执行器控制未连接':'会话运行中 · 无电机台架'):'会话已停止';if(s.control_available===false){el('claim').disabled=true;el('stop').disabled=true;el('keys').textContent='当前只测试视频，传感器和执行器联调状态尚未验证。';el('log').href='/api/log/video.jsonl';el('log').nextElementSibling.href='/api/log/video_summary.json';}el('rates').textContent=`接收 ${r.received_fps.toFixed(1)} fps · 实际绘制 ${r.drawn_fps.toFixed(1)} fps · 客户端舍弃 ${r.client_dropped} 帧 · 单帧 ${((r.frame_bytes||0)/1024).toFixed(1)} KiB`;if(p)el('policyStatus').textContent=`${p.mode} · 当前目标 ${p.output_fps} fps / Q${p.jpeg_quality} · ${p.reason}`;if(r.video_session&&!frozen)api('/api/video/feedback',r).catch(()=>{});renderMotion(a,s.telemetry_fresh);el('status').textContent=JSON.stringify({'障碍距离mm':a.distance_valid?a.distance_mm:null,'轮速mm/s':a.speed_valid?a.speed_mm_s:null,'PL停车请求':a.pl_stop,'STM32实际锁存':a.car_valid?a.car?.lock:null,'实际左PWM':a.car_valid?a.car?.left:null,'实际右PWM':a.car_valid?a.car?.right:null,'控制':s.latest?.control,'远程接管及撤销原因':s.remote_control,'视频':s.video,'故障':s.failures},null,2);}catch(e){renderMotion({},false);el('connection').textContent=e.message;}setTimeout(poll,1000);}
(async()=>{try{const token=new URLSearchParams(location.hash.slice(1)).get('token');if(token){const r=await fetch('/api/session',{method:'POST',headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(await r.text());history.replaceState(null,'',location.pathname);}await api('/api/status');const settings=await(await api('/api/video/settings')).json();el('mode').value=settings.mode;el('fps').value=settings.max_fps;el('quality').value=settings.max_quality;connect();live(view);poll();}catch(e){el('connection').textContent=e.message;}})();
window.addEventListener('pagehide',()=>player.stop());
</script></html>
