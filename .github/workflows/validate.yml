name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill helper tests
        run: python -m unittest discover -s skill/amd-pynq-project-workflow/scripts -p 'test_*.py' -v
      # r2/r3 manifests remain historical evidence; current sources are v0.11/r17b.
      # Passing these checks means artifact integrity, never vehicle acceptance.
      - name: Current r17b package and source identities
        run: python handoff/20261026/verify_current_bundle.py
      - name: Handoff archive part identities
        run: python handoff/20261026/verify_handoff.py
      - name: Markdown links
        shell: pwsh
        run: ./tools/check_markdown_links.ps1 -Root .
